<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Bulex Plus{% endblock %}</title>
    <style>
        /* Paleta do Bulex (definida pela página inicial) */
        :root {
            --creme: #f7f2e7;
            --creme-claro: #fffcf6;
            --vinho: #9b1b30;
            --vinho-escuro: #7a1526;
            --rose: #e4c1b0;
            --rose-claro: #f3e0d6;
            --texto: #333;
            --texto-suave: #555;
        }

        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: var(--creme); color: var(--texto); margin: 0; padding: 15px; }

        .container { background: var(--creme-claro); max-width: 760px; margin: 0 auto; padding: 25px 20px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
        .badge { display: inline-block; background: var(--vinho); color: var(--creme); padding: 5px 14px; border-radius: 20px; font-weight: bold; letter-spacing: 1px; }

        h1 { color: var(--vinho); font-size: 2.4rem; margin: 10px 0 5px; }
        h2 { color: var(--texto); font-size: 1.6rem; margin-top: 25px; }
        h3 { color: var(--vinho); font-size: 1.4rem; margin-top: 20px; }
        p, li { font-size: 1.4rem; line-height: 1.5; color: var(--texto); } /* Fonte grande para acessibilidade */
        a { color: var(--vinho); }

        .nota { font-size: 1.2rem; background: var(--rose-claro); border-radius: 8px; padding: 10px 15px; }
        .alerta { background: var(--rose-claro); border-left: 6px solid var(--vinho); border-radius: 8px; padding: 5px 15px; margin-top: 20px; }

        .botao { display: inline-block; background: var(--vinho); color: var(--creme); text-decoration: none; border: none; padding: 15px 25px; border-radius: 8px; font-size: 1.2rem; margin: 20px 10px 0 0; cursor: pointer; }
        .botao:hover, .botao:focus { background: var(--vinho-escuro); }
        .botao-secundario { background: transparent; color: var(--vinho); border: 2px solid var(--vinho); }
        .botao-secundario:hover, .botao-secundario:focus { background: var(--rose-claro); }

        .aviso { font-size: 1.1rem; color: var(--texto-suave); border-top: 1px solid var(--rose); margin-top: 25px; padding-top: 15px; }

        {% block estilos %}{% endblock %}
    </style>
</head>
<body>
    {% block conteudo %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
